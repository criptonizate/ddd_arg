name: QA nocturno (E2E Playwright)

# Corre todos los días a las 03:00 UTC = 00:00 de Argentina sobre producción.
# También se puede disparar manualmente desde la pestaña Actions de GitHub.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL contra la que correr los tests'
        required: false
        default: 'https://ddd-arg.vercel.app'

jobs:
  e2e:
    name: E2E ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, tablet, mobile]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests (${{ matrix.project }})
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://ddd-arg.vercel.app' }}
          CI: '1'
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload trace & videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.project }}
          path: test-results/
          retention-days: 7

      # Notificación a Telegram SOLO si ESTE job falló (un job por viewport).
      # Si fallan los 3, llegan 3 mensajes — útil porque sabés QUÉ viewport
      # rompió. El "OK consolidado" se manda desde el job `notify-success`
      # más abajo, una sola vez cuando los 3 pasaron.
      - name: Notify Telegram on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROJECT:   ${{ matrix.project }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN o TELEGRAM_CHAT_ID no configurados"
            exit 0
          fi
          TEXT=$'🧪 *QA nocturno falló*\n\nProyecto: '"$PROJECT"$'\nReporte y traces: descargables desde el run'
          curl -fsS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "content-type: application/json" \
            -d "{\"chat_id\":\"${CHAT_ID}\",\"text\":$(printf '%s' "$TEXT" | jq -Rsa .),\"parse_mode\":\"Markdown\",\"reply_markup\":{\"inline_keyboard\":[[{\"text\":\"Ver run\",\"url\":\"${RUN_URL}\"}]]}}" \
            || echo "::warning::Telegram notification failed"

  # Job final: corre SOLO si los 3 viewports pasaron todos sus tests.
  # Manda un único mensaje "OK" a Telegram para dar tranquilidad diaria.
  # Si algún job falló, GitHub salta este (needs + success()), y el mensaje
  # de "OK" no se dispara — solo quedan los de "falló" por viewport.
  notify-success:
    name: Notify OK
    runs-on: ubuntu-latest
    needs: e2e
    if: success()
    steps:
      - name: Notify Telegram on success
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN o TELEGRAM_CHAT_ID no configurados"
            exit 0
          fi
          FECHA=$(TZ='America/Argentina/Buenos_Aires' date '+%d/%m %H:%M')
          TEXT=$'✅ *QA nocturno OK*\n\nLos 3 viewports pasaron (desktop · tablet · mobile).\n'"${FECHA} AR"
          curl -fsS -X POST "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "content-type: application/json" \
            -d "{\"chat_id\":\"${CHAT_ID}\",\"text\":$(printf '%s' "$TEXT" | jq -Rsa .),\"parse_mode\":\"Markdown\",\"disable_notification\":true,\"reply_markup\":{\"inline_keyboard\":[[{\"text\":\"Ver run\",\"url\":\"${RUN_URL}\"}]]}}" \
            || echo "::warning::Telegram notification failed"
