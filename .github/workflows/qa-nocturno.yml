name: QA nocturno (E2E Playwright)

# Corre todos los días a las 03:00 UTC = 00:00 de Argentina sobre producción.
# También se puede disparar manualmente desde la pestaña Actions de GitHub.

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:
    inputs:
      base_url:
        description: 'URL contra la que correr los tests'
        required: false
        default: 'https://dddarg.com.ar'

jobs:
  e2e:
    name: E2E ${{ matrix.project }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        project: [desktop, tablet, mobile]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install deps
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run tests (${{ matrix.project }})
        env:
          BASE_URL: ${{ github.event.inputs.base_url || 'https://dddarg.com.ar' }}
          CI: '1'
        run: npx playwright test --project=${{ matrix.project }}

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-${{ matrix.project }}
          path: playwright-report/
          retention-days: 14

      - name: Upload trace & videos
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-traces-${{ matrix.project }}
          path: test-results/
          retention-days: 7

      # Notificación a Telegram SOLO si ESTE job falló (un job por viewport).
      # Si fallan los 3, llegan 3 mensajes — útil porque sabés QUÉ viewport
      # rompió. El "OK consolidado" se manda desde el job `notify-success`
      # más abajo, una sola vez cuando los 3 pasaron.
      - name: Notify Telegram on failure
        if: failure()
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          PROJECT:   ${{ matrix.project }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::warning::TELEGRAM_BOT_TOKEN o TELEGRAM_CHAT_ID no configurados"
            exit 0
          fi
          PAYLOAD=$(jq -n \
            --arg chat_id "$CHAT_ID" \
            --arg text "🧪 QA nocturno FALLÓ\\n\\nProyecto: ${PROJECT}\\nReporte y traces: descargables desde el run" \
            --arg run_url "$RUN_URL" \
            '{chat_id:$chat_id, text:$text,
              reply_markup:{inline_keyboard:[[{text:"Ver run", url:$run_url}]]}}')
          RESPONSE=$(curl -sS -w "\n__HTTP__:%{http_code}" -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "content-type: application/json" \
            -d "$PAYLOAD")
          echo "$RESPONSE"
          if echo "$RESPONSE" | grep -q '"ok":false'; then
            echo "::warning::Telegram devolvió ok:false"
          fi

  # Job final: corre SOLO si los 3 viewports pasaron todos sus tests.
  # Manda un único mensaje "OK" a Telegram para dar tranquilidad diaria.
  # Si algún job falló, GitHub salta este (needs + success()), y el mensaje
  # de "OK" no se dispara — solo quedan los de "falló" por viewport.
  notify-success:
    name: Notify OK
    runs-on: ubuntu-latest
    needs: e2e
    if: success()
    steps:
      - name: Notify Telegram on success
        env:
          BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          CHAT_ID:   ${{ secrets.TELEGRAM_CHAT_ID }}
          RUN_URL:   ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$BOT_TOKEN" ] || [ -z "$CHAT_ID" ]; then
            echo "::error::TELEGRAM_BOT_TOKEN o TELEGRAM_CHAT_ID no configurados"
            exit 1
          fi
          FECHA=$(TZ='America/Argentina/Buenos_Aires' date '+%d/%m %H:%M')
          # Armamos el payload JSON con jq (safe quoting). Evitamos el $'...'
          # de bash + expansión que podía romper en algunos runners.
          PAYLOAD=$(jq -n \
            --arg chat_id "$CHAT_ID" \
            --arg text "✅ QA nocturno OK\\n\\nLos 3 viewports pasaron (desktop · tablet · mobile).\\n${FECHA} AR" \
            --arg run_url "$RUN_URL" \
            '{chat_id:$chat_id, text:$text, disable_notification:true,
              reply_markup:{inline_keyboard:[[{text:"Ver run", url:$run_url}]]}}')
          echo "Payload a enviar (sin token):"
          echo "$PAYLOAD"
          # -w graba el status HTTP después del body — así vemos ok:true/false.
          RESPONSE=$(curl -sS -w "\n__HTTP__:%{http_code}" -X POST \
            "https://api.telegram.org/bot${BOT_TOKEN}/sendMessage" \
            -H "content-type: application/json" \
            -d "$PAYLOAD")
          echo "Respuesta de Telegram:"
          echo "$RESPONSE"
          # Si el body indica ok:false, fallamos el step para que lo veamos.
          if echo "$RESPONSE" | grep -q '"ok":false'; then
            echo "::error::Telegram devolvió ok:false"
            exit 1
          fi
          HTTP_CODE=$(echo "$RESPONSE" | grep -oE '__HTTP__:[0-9]+' | cut -d: -f2)
          if [ "$HTTP_CODE" != "200" ]; then
            echo "::error::HTTP $HTTP_CODE"
            exit 1
          fi
